services:
  medical-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medical-imaging-api
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      - orthanc

  orthanc:
    image: orthancteam/orthanc:latest
    container_name: medical-imaging-orthanc
    ports:
      - "127.0.0.1:8042:8042"
      - "127.0.0.1:4242:4242"
    environment:
      ORTHANC__NAME: "Medical Imaging DICOM Server"
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: '{"admin":"ChangeThisPassword123!"}'
    volumes:
      - orthanc-storage:/var/lib/orthanc/db
    restart: unless-stopped

volumes:
  orthanc-storage:

